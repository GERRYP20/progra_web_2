<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro AFTER-REWIND</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
    <div class="effect" style="width: 100%; max-width: 500px;">
      <h2 style="color: white; text-align: center; margin-bottom: 10px;">Nuevo Usuario</h2>
      <p style="color: #aaa; text-align: center; margin-bottom: 25px;">Crea tu cuenta en galeria infinita</p>

      <form style="display: flex; flex-direction: column; gap: 15px;">
        <input type="text" placeholder="Nombre Completo" style="padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: white;">

        <input type="text" placeholder="Correo Electrónico" style="padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: white;">

        <div style="display: flex; flex-direction: column;">
          <label style="color: #aaa; font-size: 12px; margin-bottom: 5px;"> Fecha de tu evento</label>
          <input type="date" style="padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: white;">
        </div>

        <input type="password" placeholder="Contraseña" style="padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: white;">
        
        <input type="password" placeholder="Confirmar Contraseña" style="padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: white;">

        <label style="color: #ddd; font-size: 13px; display: flex; gap: 10px; align-items: flex-start;">
          <input type="checkbox" style="margin-top: 4px;">
          Acepto los terminos, condiciones y la política de privacidad
        </label>

        <button type="submit" class="btn-primary" style="border: none; cursor: pointer; margin-top: 10px;">CREAR MI CUENTA</button>
      </form>

      <p style="margin-top: 25px; text-align: center; font-size: 14px; color: #aaa;">
        ¿Ya tienes tu cuenta? <a href="login.html" class="highlight" style="text-decoration: none;"> Inicia sesión aquí</a>
      </p>
    </div>
  </body>
</html>
