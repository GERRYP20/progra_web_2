<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SHAREEVENT</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div class="effect" style="width: 100%; max-width: 400px; text-align: center;">
        <h2 style="color: white; margin-bottom: 20px;">Iniciar Sesión</h2>
        
        <form style="display: flex; flex-direction: column; gap: 15px;">
            <input type="email" placeholder="Correo electrónico" style="padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: white;">
            <input type="password" placeholder="Contraseña" style="padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: white;">
            
            <a href="#" class="btn-primary" style="margin-top: 10px;">INGRESAR</a>
        </form>
        
        <p style="margin-top: 20px; font-size: 14px; color: #aaa;">
            ¿No tienes una cuenta? <span class="highlight">Regístrate aquí</span>
        </p>
    </div>
</body>
</html>
